name: Build ElektorykScan APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack uploaded source ZIP (when present)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle ]; then
            mapfile -t archives < <(find . -maxdepth 2 -type f -iname 'ElektorykScan*.zip' | sort)
            if [ "${#archives[@]}" -ne 1 ]; then
              echo "::error::Upload exactly one ElektorykScan source ZIP to repository root (or commit extracted Android source)."
              exit 1
            fi
            python3 - "${archives[0]}" <<'PY'
          import pathlib, sys, zipfile
          p=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              for f in z.infolist():
                  target=pathlib.PurePosixPath(f.filename)
                  if target.is_absolute() or '..' in target.parts:
                      raise ValueError('Unsafe ZIP path: '+f.filename)
              z.extractall('.')
          PY
          fi
          test -f settings.gradle
          test -f app/build.gradle
      - name: Apply scanner regression fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/elektoryk/scan')
          def edit(rel, pairs):
              p=root/rel
              s=p.read_text()
              for a,b in pairs:
                  assert s.count(a)==1, (rel,a)
                  s=s.replace(a,b)
              p.write_text(s)
          edit('scanner/ar/DepthSurfaceTracker.java',[
              ('ensureFitWorkspace(f.indices.length);','ensureFitWorkspace(f.count);'),
              ('for(int q:f.indices){','for(int ii=0;ii<f.count;ii++){\n            int q=f.indices[ii];\n            if(q<0||q>=ev.pointCount||q>=xyz.length/3)continue;'),
              ('ensureFitIndexWorkspace(bestCount);','ensureFitIndexWorkspace(n);')])
          edit('scanner/ar/ArSurfaceGridRenderer.java',[
              ('if(focus==SemanticLabel.OBJECT&&semanticFocusShare<0.58f)focus=SemanticLabel.UNKNOWN;','if(focus==SemanticLabel.OBJECT)focus=SemanticLabel.UNKNOWN;'),
              ('if(focus.objectLike&&!focus.isOpening()&&!focus.isRoomEnvelope())return activeSurfaceWorkspace;','if(focus.objectLike&&!focus.isOpening()&&!focus.isRoomEnvelope())focus=SemanticLabel.UNKNOWN;'),
              ('stableWalls>=3&&stableWalls<=6&&stableHorizontals>=1','stableWalls>=3&&stableHorizontals>=1')])
          edit('ui/ArCoreScanActivity.java',[
              ('progress.setProgress(st.scanQualityPercent);','progress.setProgress(gridStats.stableWalls<3?Math.min(49,st.scanQualityPercent):Math.min(99,st.scanQualityPercent));'),
              ('if(sem!=null&&sem.modelState==com.elektoryk.scan.semantic.SemanticModelManager.State.READY&&sem.lookingAtShare>=0.34f&&sem.lookingAt.objectLike&&!sem.lookingAt.isOpening()){','if(gridStats.stableWalls<3){\n                        hint.setText("Ще не готово: підтверджено стін "+gridStats.stableWalls+". Повільно пройди вздовж стін, покажи стики з підлогою та верхні кути. Зміщуй телефон убік, а не лише обертай.");\n                    }else if(sem!=null&&sem.modelState==com.elektoryk.scan.semantic.SemanticModelManager.State.READY&&sem.lookingAt!=SemanticLabel.OBJECT&&sem.lookingAtShare>=0.34f&&sem.lookingAt.objectLike&&!sem.lookingAt.isOpening()){'),
              ('if(heldReady)\n                    scanButton.setText("Завершити • стабільний скан ✓");','if(heldReady){\n                    progress.setProgress(100);\n                    hint.setText("Скан готовий до аналізу. Можна завершувати.");\n                    scanButton.setText("Завершити • стабільний скан ✓");\n                }'),
              ('"Завершити скан і проаналізувати");\n            });','"Доскануй • або завершити чернетку");\n            });'),
              ('}catch(Exception e){\n            runOnUiThread(() -> {if(!activityDestroyed&&!isFinishing()&&!isDestroyed())status.setText("AR frame error: "+e.getClass().getSimpleName());});','}catch(Exception e){\n            android.util.Log.e("ElektorykScan","AR frame processing failed",e);\n            runOnUiThread(() -> {if(!activityDestroyed&&!isFinishing()&&!isDestroyed())status.setText("AR frame error: "+e.getClass().getSimpleName());});')])
          edit('scanner/ar/DepthSurfaceTracker.java',[
              ('return refine(xyz,idx,m,cameraY);','Fit result=refine(xyz,idx,m,cameraY);\n        if(result!=null)return result;\n        // Reject only this candidate, not the remaining frame. Bound retries.\n        for(int ii=0;ii<m;ii++)available[idx[ii]]=false;\n        return pass<MAX_PLANES_PER_FRAME+2?fitBest(xyz,n,available,cameraY,frameId,pass+1):null;'),
              ('if(ev==null||ev.localXyz==null||ev.pointCount<MIN_FRAME_INLIERS)return;','if(ev==null||ev.localXyz==null||ev.pointCount<MIN_FRAME_INLIERS)return;\n        if(!Float.isFinite(ev.localCameraX)||!Float.isFinite(ev.localCameraY)||!Float.isFinite(ev.localCameraZ))return;'),
              ('if(len<0.02f)continue;','if(!Float.isFinite(len)||len<0.02f)continue;')])
          edit('semantic/SemanticSceneTracker.java',[
              ('if(lab==SemanticLabel.UNKNOWN||lab==SemanticLabel.PERSON)continue;','if(lab==SemanticLabel.UNKNOWN||lab==SemanticLabel.PERSON||lab==SemanticLabel.OBJECT)continue;'),
              ('if(depth<0.20f||depth>6.5f)continue;','if(!finite(depth)||depth<0.20f||depth>6.5f)continue;'),
              ('if(u<0||v<0||u>=meta.width||v>=meta.height)continue;','if(!finite(u)||!finite(v)||u<0||v<0||u>=meta.width||v>=meta.height)continue;')])
          edit('semantic/IndoorSemanticSegmenter.java',[
              ('if(interpreter==null||argb==null||sw<=0||sh<=0)return null;','if(interpreter==null||argb==null||sw<=0||sh<=0||(long)sw*sh>argb.length)return null;'),
              ('if(ow<=0||oh<=0)return null;','if(ow<=0||oh<=0)return null;\n        if(logits&&classes!=(loadedFlavor==SemanticModelManager.Flavor.ML_PERF_32?32:151))return null;'),
              ('SemanticLabel.fromModelIndex(best,loadedFlavor),share','SemanticLabel.fromModelIndex(best,loadedFlavor)==SemanticLabel.OBJECT?SemanticLabel.UNKNOWN:SemanticLabel.fromModelIndex(best,loadedFlavor),share')])
          edit('ui/ArCoreScanActivity.java',[
              ('ai="AI"+modelTag+": "+sem.lookingAt.ua+" "+Math.round(sem.lookingAtShare*100f)+"%"+dims+" • об\'єктів "+sem.entities;','ai="AI"+modelTag+": "+sem.lookingAt.ua+" • частка маски "+Math.round(sem.lookingAtShare*100f)+"%"+dims+" • сутностей "+sem.entities+(modelTag.equals("32")?" • обмежені класи":"");')])
          edit('semantic/IndoorSemanticSegmenter.java',[
              ('interpreter=new Interpreter(map,opt);loadedFile=model;loadedFlavor=flavor;return true;','interpreter=new Interpreter(map,opt);\n            interpreter.allocateTensors();\n            Tensor it=interpreter.getInputTensor(0),ot=interpreter.getOutputTensor(0);\n            int[] a=it.shape(),b=ot.shape();\n            if(a.length!=4||a[0]!=1||a[3]!=3||a[1]<=0||a[2]<=0||a[1]>2048||a[2]>2048||it.dataType()!=DataType.FLOAT32)throw new IllegalArgumentException("Unsupported RGB tensor");\n            if(b.length<3||b.length>4||b[0]!=1||b[1]<=0||b[2]<=0||ot.numBytes()<=0||ot.numBytes()>128*1024*1024)throw new IllegalArgumentException("Unsupported output tensor");\n            if(b.length==4&&b[3]!=1&&b[3]!=(flavor==SemanticModelManager.Flavor.ML_PERF_32?32:151))throw new IllegalArgumentException("Unexpected class count");\n            loadedFile=model;loadedFlavor=flavor;return true;'),
              ('}catch(Throwable t){close();return false;}','}catch(Throwable t){android.util.Log.e("ElektorykSemantic","Model initialization failed: "+flavor,t);close();return false;}'),
              ('int elems=1;for(int v:os)elems*=Math.max(1,v);int bytes=bytesPer(outT.dataType());if(bytes<=0)return null;','int bytes=bytesPer(outT.dataType());if(bytes<=0)return null;\n        int totalBytes=outT.numBytes();if(totalBytes<=0||totalBytes>128*1024*1024||totalBytes%bytes!=0)return null;\n        int elems=totalBytes/bytes;'),
              ('float v=readAsFloat(output,dt);if(v>bv){bv=v;best=c;}','float v=readAsFloat(output,dt);if(Float.isFinite(v)&&v>bv){bv=v;best=c;}'),
              ('dense[p]=best;','dense[p]=bv==-Float.MAX_VALUE?(loadedFlavor==SemanticModelManager.Flavor.ML_PERF_32?31:0):best;')])
          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 132','versionCode 135').replace('0.29.1-bounded-semantic-finalization','0.29.4-tensor-validation')
          p.write_text(s)
          PY
      - name: Install required Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Compile debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ElektorykScan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
