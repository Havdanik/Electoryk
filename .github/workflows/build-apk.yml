name: Build ElektorykScan APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack uploaded source ZIP (when present)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle ]; then
            mapfile -t archives < <(find . -maxdepth 2 -type f -iname 'ElektorykScan*.zip' | sort)
            if [ "${#archives[@]}" -ne 1 ]; then
              echo "::error::Upload exactly one ElektorykScan source ZIP to repository root (or commit extracted Android source)."
              exit 1
            fi
            python3 - "${archives[0]}" <<'PY'
          import pathlib, sys, zipfile
          p=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              for f in z.infolist():
                  target=pathlib.PurePosixPath(f.filename)
                  if target.is_absolute() or '..' in target.parts:
                      raise ValueError('Unsafe ZIP path: '+f.filename)
              z.extractall('.')
          PY
          fi
          test -f settings.gradle
          test -f app/build.gradle
      - name: Install required Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Compile debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ElektorykScan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
